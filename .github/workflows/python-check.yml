name: Python and FFmpeg checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Compile application and engine
        run: python -m py_compile clipforge_studio.py editor_engine.py
      - name: Run editor unit tests
        run: python -m unittest discover -s tests -v
      - name: Run FFmpeg filter smoke tests
        run: python tests/ffmpeg_smoke.py

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg --no-progress -y
      - name: Compile application and engine
        run: python -m py_compile clipforge_studio.py editor_engine.py
      - name: Run editor unit tests
        run: python -m unittest discover -s tests -v
      - name: Run FFmpeg filter smoke tests
        run: python tests/ffmpeg_smoke.py
